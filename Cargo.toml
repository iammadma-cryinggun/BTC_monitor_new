[package]
name = "btc-futures-sniper"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# WebSocket
tokio-tungstenite = { version = "0.20", features = ["native-tls"] }
futures-util = "0.3"

# HTTP client
reqwest = { version = "0.11", features = ["json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
rusqlite = { version = "0.29", features = ["bundled"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time
chrono = "0.4"

# Config
toml = "0.8"

# Error handling
anyhow = "1"
thiserror = "1"

# Math
statrs = "0.15"

# Binance API
binance_spot = { path = "./binance_spot" }

[profile.release]
opt-level = 3
lto = true