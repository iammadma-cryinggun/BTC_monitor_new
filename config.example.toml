# BTC Futures Sniper 配置文件示例
# 复制此文件为 config.toml 并填入你的配置

[binance]
api_key = ""
api_secret = ""
testnet = false  # 正式环境

[trading]
symbol = "BTCUSDT"
leverage = 10  # 杠杆倍数
position_size_pct = 0.05  # 单笔仓位比例 (5%)
max_positions = 1  # 最大持仓数

# 模拟模式：使用真实市场数据，不实际下单
dry_run = true
initial_balance = 1000.0  # 模拟初始资金 USDT

[telegram]
enabled = true
bot_token = ""  # 从 @BotFather 获取
chat_id = ""    # 你的Telegram Chat ID

[risk]
stop_loss_pct = 0.02  # 止损 2%
take_profit_pct = 0.01  # 止盈 1%
max_hold_time_secs = 300  # 最大持仓时间 5分钟
trailing_stop = true  # 移动止损
trailing_stop_pct = 0.005  # 移动止损 0.5%

[signal]
# OBI阈值 (复用Polymarket逻辑)
gold_bull_obi = 0.40  # 做多OBI阈值
bear_no_obi = -0.30  # 做空OBI阈值
diff_threshold = 40.0  # diff阈值

# 时间窗口
time_min = 10.0  # 最小时间
time_max = 45.0  # 最大时间

# OBI反转检查
obi_reversal_check = true

[database]
path = "./data/trades.db"

[logging]
level = "info"
